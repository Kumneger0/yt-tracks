[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-tracks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "connectrpc>=0.13.0",
    "protobuf==7.36.2",
    "python-dotenv>=1.2.2",
    "uvicorn==0.54.0",
    "ytmusicapi>=1.12.2",
]

[project.scripts]
yt-tracks-backend = "grpc_server.main:serve"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
]

[tool.hatch.build]
exclude = [".venv/", "build/", "dist/", "wheels/", "main.build/", "main.dist/"]

[tool.hatch.build.targets.wheel]
packages = ["grpc_server"]
include = ["grpc_server/**/*.py", "grpc_server/**/*.pyi"]
artifacts = ["grpc_server/gen/*.py", "grpc_server/gen/*.pyi"]



[tool.basedpyright]
typeCheckingMode = "recommended"
exclude = ["grpc_server/gen"]
extraPaths = [".", "grpc_server", "grpc_server/gen"]
reportMissingParameterType = "none"
