version: 2
project_name: yt-tracks

env:
  - GO111MODULE=on
  - SERVER_URL={{.Env.SERVER_URL }}

before:
  hooks:
    - ./scripts/manpages.sh {{ .Env.SERVER_URL }}
    - ./scripts/completions.sh {{ .Env.SERVER_URL }}

builds:
  - id: yt-tracks
    main: .
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.serverURL={{ .Env.SERVER_URL }}
    binary: yt-tracks
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - 386

    ignore:
      - goos: linux
        goarch: arm64
      - goos: linux
        goarch: "386"
      - goos: darwin
        goarch: amd64
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: "386"
    

    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1 
          - CC=gcc

archives:
  - ids:
      - yt-tracks
    format_overrides: []
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

nfpms:
  - ids:
      - yt-tracks
    vendor: kumneger0
    homepage: https://github.com/kumneger0/yt-tracks
    maintainer: "Kumneger wondimu <Kumnegerwondimu@gmail.com>"
    description: "CLI-based Spotify client"
    license: GPL-3.0
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./manpages/yt-tracks.1.gz
        dst: /usr/share/man/man1/yt-tracks.1.gz
        file_info:
          mode: 0644
      - src: ./completions/yt-tracks.bash
        dst: /usr/share/bash-completion/completions/yt-tracks
        file_info:
          mode: 0644
      - src: ./completions/yt-tracks.fish
        dst: /usr/share/fish/vendor_completions.d/yt-tracks.fish
        file_info:
          mode: 0644
      - src: ./completions/yt-tracks.zsh
        dst: /usr/share/zsh/vendor-completions/_yt-tracks
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^test:'
      - '^chore'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: Dependency updates
      regexp: '^.*?(feat|fix)\(deps\)!?:.+$'
      order: 300
    - title: 'New Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: 'Documentation updates'
      regexp: '^.*?doc(\([[:word:]]+\))??!?:.+$'
      order: 400
    - title: Other work
      order: 9999
